name: Build Server Binary (Linux only → Releases)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Package to Linux binary
        run: npx @yao-pkg/pkg index.js --targets node20-linux-x64 --output lxserver-linux-x64   # ←←← 改这里

      - name: Release to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: lxserver-linux-x64*
          name: Server Binary ${{ github.ref_name }}
          body: |
            LX Music Server Linux 二进制（Node 22 构建）
            
            使用方法：
            ```bash
            chmod +x lxserver-linux-x64
            ./lxserver-linux-x64
            ```
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

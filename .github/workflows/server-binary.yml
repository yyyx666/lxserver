name: Build Server Binary (Linux only → Releases)

on:
  push:
    tags:
      - 'v*'                    # 打 v1.0.0 等标签时自动触发
  workflow_dispatch:            # 手动触发测试

jobs:
  build-linux:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Install pkg (active fork)
        run: npm install -g @yao-pkg/pkg   # 推荐用活跃维护的 fork

      - name: Package to Linux binary
        run: |
          @yao-pkg/pkg index.js --targets node20-linux-x64 --output lxserver-linux-x64

      - name: Upload artifact (临时备份)
        uses: actions/upload-artifact@v4
        with:
          name: lxserver-linux-x64
          path: lxserver-linux-x64*

      # ============ 关键：发布到 Releases ============
      - name: Release to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: lxserver-linux-x64*
          name: Server Binary ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

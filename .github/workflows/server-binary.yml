name: Build Server Binary (Linux only - Node 22)

on:
  push:
    tags:
      - 'v*'                    # 打 v1.x.x 标签时自动打包
  workflow_dispatch:            # 手动触发

jobs:
  build-linux:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Install pkg
        run: npm install -g pkg

      - name: Package to Linux binary
        run: |
          pkg dist/index.js \
            --targets node22-linux-x64 \
            --output lxserver-linux-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lxserver-linux-x64
          path: lxserver-linux-x64*

      # 可选：自动发布到 Releases
      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: lxserver-linux-x64*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

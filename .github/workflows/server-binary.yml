name: Build Server Binary

on:
  push:
    tags:
      - 'v*'          # 打 tag 如 v1.9.4 时自动打包
  workflow_dispatch:   # 也可以手动触发

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: node20-linux-x64
            artifact: linux-x64
          - os: windows-latest
            target: node20-win-x64
            artifact: win-x64
          - os: macos-latest
            target: node20-macos-x64
            artifact: macos-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Install pkg
        run: npm install -g pkg

      - name: Package to binary
        run: |
          pkg . --targets ${{ matrix.target }} --output lxserver-${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lxserver-${{ matrix.artifact }}
          path: lxserver-${{ matrix.artifact }}*
